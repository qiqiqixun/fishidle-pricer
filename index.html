  .fq-panel.fq-compact .fq-resize{display:none}
  `;

  const style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  const root = document.createElement('div');
  root.id = 'fq-root';
  document.body.appendChild(root);

  const launch = document.createElement('div');
  launch.className = 'fq-launch';
  launch.textContent = '价';
  launch.title = 'FishIdle 定价器（点击展开，可拖动）';
  const pos = LS.get('fq_pos', { x: 18, y: 140 });
  launch.style.left = pos.x + 'px';
  launch.style.top = pos.y + 'px';
  root.appendChild(launch);

  const panel = document.createElement('div');
  panel.className = 'fq-panel';
  panel.style.width = 'min(1060px, calc(100vw - 24px))';
  panel.style.height = 'min(680px, calc(100vh - 24px))';
  panel.style.left = '12px';
  panel.style.top = '12px';
  panel.style.display = 'none';
  panel.innerHTML = `
    <div class="fq-head">
      <span class="t">定价器</span><span class="s">目标日收益 → 该卖多少钱</span>
      <div class="btns">
        <button id="fq-dens">紧凑</button>
        <button id="fq-min">收起</button>
      </div>
    </div>
    <div class="fq-body">
      <aside class="fq-side">
        <h2>采集</h2><div class="fq-nav" id="fq-navGather"></div>
        <h2>制造</h2><div class="fq-nav" id="fq-navCraft"></div>
      </aside>
      <aside class="fq-mid" id="fq-mid"></aside>
      <main class="fq-main">
        <div class="fq-top">
          <div class="fq-search">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7d8b99"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="fq-q" placeholder="搜索配方名称或类别">
          </div>
          <div class="fq-tiers" id="fq-tiers"></div>
        </div>
        <div class="fq-params">
          <div class="fq-pf">目标日收益 <input id="fq-target" type="text" value="10K" placeholder="如 10K / 1.5M"></div>
          <div class="fq-pf">有效小时 <input id="fq-hours" type="number" value="24" step="0.5" max="24"></div>
          <div class="fq-pf">默认加速% <input id="fq-acc" type="number" value="0" step="1"></div>
          <button class="fq-btn" id="fq-accBtn">分类加速</button>
          <div class="fq-seg" id="fq-yieldSeg"><button data-v="avg" class="on">平均产量</button><button data-v="min">保底产量</button></div>
          <div class="fq-seg" id="fq-matSeg"><button data-v="self" class="on">全自产</button><button data-v="buy">材料外购</button></div>
          <div class="fq-sum" id="fq-sum"></div>
        </div>
        <div class="fq-grid" id="fq-grid"></div>
      </main>
      <div class="fq-accbox" id="fq-accbox"></div>
      <div class="fq-drawer" id="fq-drawer"></div>
    </div>
    <div class="fq-foot" id="fq-foot"></div>
    <div class="fq-resize" id="fq-resize" title="拖动调整大小"></div>
  `;
  root.appendChild(panel);

  const gather = DATA.gather, recipes = DATA.recipes, metaItems = DATA.meta_items, nodes = DATA.nodes;
  const PROF = { Artisan: '工匠', Smithing: '锻造', Tailoring: '裁缝', Cooking: '烹饪' };
  const PROF_ICON = { Artisan: '工', Smithing: '锻', Tailoring: '裁', Cooking: '烹' };
  const SKILL_ICON = { 采矿: '矿', 伐木: '木', 采集: '采', 钓鱼: '鱼' };
  const SKILLS = ['采矿', '伐木', '采集', '钓鱼'];
  const $ = s => panel.querySelector(s);

  const saved = LS.get('fq_state', {});
  const state = Object.assign({
    mode: 'craft', prof: 'Artisan', cat: '', skill: '采矿', area: '', tier: '', q: '', dens: 0,
    target: 10000, hours: 24, acc: 0, yieldMode: 'avg', matMode: 'self', open: null
  }, saved);
  state.open = null;
  const priceStore = LS.get('fq_prices', {});
  const selfMats = LS.get('fq_selfmats', {});      // 外购模式下仍自产的直接材料
  const accMap = LS.get('fq_accmap', {});          // 'c:类别' / 's:技能' -> 百分比

  /* ---------------- 计算 ---------------- */
  const memo = {};
  const accC = cat => { const v = accMap['c:' + cat]; return typeof v === 'number' ? v : state.acc; };
  const accS = sk => { const v = accMap['s:' + sk]; return typeof v === 'number' ? v : state.acc; };
  const priceOf = n => { const p = parseFloat(priceStore[n]); return isNaN(p) ? 0 : p; };
  const isSelfMade = n => state.matMode !== 'buy' || !!selfMats[n];

  // 单件有效耗时（已含各层加速；外购且不自产的材料不占工时）
  function effTime(name, stack) {
    if (memo[name] !== undefined) return memo[name];
    stack = stack || new Set();
    if (stack.has(name)) return Infinity;
    if (name === null) return Infinity;
    stack.add(name);
    let best = Infinity;
    const rs = recipes[name];
    if (rs) {
      for (const r of rs) {
        let t = r.sec / (1 + accC(r.category) / 100), ok = true;
        for (const ing of r.ingredients) {
          if (!isSelfMade(ing.name)) continue;         // 买来的料：只有钱成本，不占工时
          const ut = effTime(ing.name, stack);
          if (ut === Infinity) { ok = false; break; }
          t += ing.qty * ut;
        }
        if (ok) best = Math.min(best, t / r.qty);
      }
    }
    const g = gather[name];
    if (g) {
      const y = state.yieldMode === 'min' ? g.ymin : (g.ymin + g.ymax) / 2;
      best = Math.min(best, g.sec / (1 + accS(g.skill) / 100) / Math.max(y, 0.01));
    }
    stack.delete(name);
    memo[name] = best;
    return best;
  }

  // 每件分摊的材料采购成本（只算买来的直接材料）
  function matCost(name) {
    const r = recipes[name] && recipes[name][0];
    if (!r) return 0;
    let c = 0;
    for (const ing of r.ingredients) {
      if (isSelfMade(ing.name)) continue;
      c += ing.qty * priceOf(ing.name);
    }
    return c / r.qty;
  }

  function rowCalc(name) {
    const r = recipes[name][0];
    const u = effTime(name);
    const perDay = u === Infinity ? 0 : state.hours * 3600 / u;
    const mc = state.matMode === 'buy' ? matCost(name) : 0;
    return { name, r, u, perDay, mc, price: perDay > 0 ? state.target / perDay + mc : 0 };
  }
  function gatherCalc(node, y) {
    const avg = state.yieldMode === 'min' ? y.min : (y.min + y.max) / 2;
    const unit = node.sec / (1 + accS(node.skill) / 100) / Math.max(avg, 0.01);
    const perDay = state.hours * 3600 / unit;
    return { unit, perDay, price: state.target / perDay };
  }

  /* ---------------- 格式化 ---------------- */
  const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(n >= 1e10 ? 0 : 1).replace(/\.0$/, '') + 'B'
                : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M'
                : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K'
                : (n ? Math.round(n).toLocaleString() : '—');
  const fmtMoney = p => {
    if (!p) return '—';
    if (p >= 1e3) {
      const u = p >= 1e9 ? [1e9, 'B'] : p >= 1e6 ? [1e6, 'M'] : [1e3, 'K'];
      const v = p / u[0];
      return (v >= 100 ? v.toFixed(0) : v.toFixed(2).replace(/\.?0+$/, '')) + u[1];
    }
    return p < 1 ? p.toFixed(3) : p < 10 ? p.toFixed(3).replace(/0+$/, '').replace(/\.$/, '') : p.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
  };
  const parseAmount = s => {
    const t = String(s == null ? '' : s).trim().replace(/[,，\s]/g, '');
    const m = t.match(/^([0-9]*\.?[0-9]+)\s*([kKmMbB万亿]?)$/);
    if (!m) return 0;
    const mult = { k: 1e3, K: 1e3, m: 1e6, M: 1e6, b: 1e9, B: 1e9, 万: 1e4, 亿: 1e8 }[m[2]] || 1;
    return parseFloat(m[1]) * mult;
  };
  function tierColor(t) {
    const n = +String(t).replace(/[^0-9]/g, '') || 1;
    const hues = [205, 150, 175, 45, 280, 20, 320, 250];
    return `hsl(${hues[(n - 1) % 8]} 55% 42%)`;
  }

  /* ---------------- 侧栏 / 中列 ---------------- */
  function buildNav() {
    $('#fq-navGather').innerHTML = SKILLS.map(s => {
      const cnt = nodes.filter(n => n.skill === s).length;
      return `<a data-kind="gather" data-skill="${s}" class="${state.mode === 'gather' && state.skill === s ? 'on' : ''}">
        <span class="ic">${SKILL_ICON[s]}</span><span>${s}</span><span class="n">${cnt}</span></a>`;
    }).join('');
    $('#fq-navCraft').innerHTML = ['Artisan', 'Smithing', 'Tailoring', 'Cooking'].map(p => {
      const cnt = Object.keys(recipes).filter(n => recipes[n][0].profession === p).length;
      return `<a data-kind="craft" data-prof="${p}" class="${state.mode === 'craft' && state.prof === p ? 'on' : ''}">
        <span class="ic">${PROF_ICON[p]}</span><span>${PROF[p]}</span><span class="n">${cnt}</span></a>`;
    }).join('');
    $('#fq-navGather').querySelectorAll('a').forEach(a => a.onclick = () => {
      state.mode = 'gather'; state.skill = a.dataset.skill; state.area = ''; state.open = null; render();
    });
    $('#fq-navCraft').querySelectorAll('a').forEach(a => a.onclick = () => {
      state.mode = 'craft'; state.prof = a.dataset.prof; state.cat = ''; state.open = null; render();
    });
  }

  function buildMid() {
    if (state.mode === 'gather') {
      const areas = nodes.filter(n => n.skill === state.skill);
      if (!state.area || !areas.some(a => a.area === state.area)) state.area = areas[0].area;
      $('#fq-mid').innerHTML = `<div class="grp">${state.skill} · 区域</div>` + areas.map(n =>
        `<a data-area="${n.area}" class="${state.area === n.area ? 'on' : ''}">${n.area}<span class="c">${n.tier} · ${accS(n.skill)}%</span></a>`
      ).join('');
      $('#fq-mid').querySelectorAll('a').forEach(a => a.onclick = () => { state.area = a.dataset.area; state.open = null; render(); });
    } else {
      const cats = [...new Set(Object.keys(recipes).filter(n => recipes[n][0].profession === state.prof).map(n => recipes[n][0].category))];
      const total = Object.keys(recipes).filter(n => recipes[n][0].profession === state.prof).length;
      $('#fq-mid').innerHTML = `<div class="grp">${PROF[state.prof]} · 类别（括号为加速）</div>` +
        `<a data-cat="" class="${!state.cat ? 'on' : ''}">全部<span class="c">${total}</span></a>` +
        cats.map(c => {
          const k = Object.keys(recipes).filter(n => recipes[n][0].profession === state.prof && recipes[n][0].category === c).length;
          const a = accC(c);
          return `<a data-cat="${c}" class="${state.cat === c ? 'on' : ''}">${c}<span class="c">${k}条 · ${a}%</span></a>`;
        }).join('');
      $('#fq-mid').querySelectorAll('a').forEach(a => a.onclick = () => { state.cat = a.dataset.cat; state.open = null; render(); });
    }
  }

  /* ---------------- 卡片 ---------------- */
  function cardCraft(name) {
    const c = rowCalc(name), t = c.r, tier = (metaItems[name] || {}).tier;
    const bad = c.u === Infinity ? `<div class="bad">材料含战斗掉落，无法用时间换算</div>` : '';
    return `<div class="fq-card" data-craft="${encodeURIComponent(name)}">
      <div class="ch"><span class="icon" style="background:${tierColor(tier)}">${(name[0] || '').trim()}</span>
      <span class="nm">${name}</span><span class="tb">T${tier || '-'}</span></div>
      <div class="l2">产出 ×${t.qty} · 经验 +${t.xp} · 基础 ${t.sec.toFixed(1)}秒 · 单件 ${c.u === Infinity ? '∞' : c.u.toFixed(2)}秒 · 加速 ${accC(t.category)}%</div>
      ${bad}
      <div class="l3"><span class="p">${fmtMoney(c.price)}</span><span class="u">金/件</span><span class="d">日 ${fmt(c.perDay)}</span></div>
      <div class="chips">${t.ingredients.map(i => i.name + '×' + i.qty).join(' · ')}</div>
    </div>`;
  }
  function cardGather(node, y) {
    const c = gatherCalc(node, y);
    return `<div class="fq-card" data-gather="${encodeURIComponent(node.area + '@' + y.name)}">
      <div class="ch"><span class="icon" style="background:${tierColor(node.tier)}">${(y.name[0] || '').trim()}</span>
      <span class="nm">${y.name}</span><span class="tb">T${String(node.tier).replace('T', '')}</span></div>
      <div class="l2">${node.skill} · ${node.area} · ${node.sec.toFixed(1)}秒/次 · 产量 ×${y.min}–${y.max} · 加速 ${accS(node.skill)}%</div>
      <div class="l3"><span class="p">${fmtMoney(c.price)}</span><span class="u">金/件</span><span class="d">日 ${fmt(c.perDay)}</span></div>
      <div class="chips">单件 ${c.unit.toFixed(2)}s · 经验 +${node.xp}</div>
    </div>`;
  }

  function renderGrid() {
    const q = state.q.trim(), g = $('#fq-grid');
    if (state.mode === 'craft') {
      let list = Object.keys(recipes).filter(n => {
        const r = recipes[n][0];
        if (state.prof && r.profession !== state.prof) return false;
        if (state.cat && r.category !== state.cat) return false;
        if (state.tier && String((metaItems[n] || {}).tier) !== state.tier) return false;
        if (q && !(n.includes(q) || (r.category || '').includes(q))) return false;
        return true;
      });
      list.sort((a, b) => (effTime(a) === Infinity ? 1 : 0) - (effTime(b) === Infinity ? 1 : 0) || a.localeCompare(b, 'zh'));
      g.innerHTML = list.length ? list.map(cardCraft).join('') : '<div class="fq-empty">这个类别下没有匹配的配方</div>';
    } else {
      const node = nodes.find(n => n.skill === state.skill && n.area === state.area);
      if (!node) { g.innerHTML = '<div class="fq-empty">未找到该区域</div>'; return; }
      let ys = node.yields.filter(y => !q || y.name.includes(q));
      if (state.tier && String(node.tier) !== ('T' + state.tier)) ys = [];
      g.innerHTML = ys.length ? ys.map(y => cardGather(node, y)).join('') : '<div class="fq-empty">该区域没有匹配的资源</div>';
    }
  }

  /* ---------------- 详情 ---------------- */
  function treeRows(name, depth, rows) {
    const r = recipes[name] && recipes[name][0];
    const g = gather[name];
    if (r) {
      const buyAll = state.matMode === 'buy' && !selfMats[name];
      rows.push({ d: depth, k: `${name} · 本工序 ${r.sec.toFixed(1)}s ÷ ${r.qty} · 加速 ${accC(r.category)}%`,
                  v: `${(r.sec / r.qty).toFixed(2)}s/件`, b: true });
      if (depth < 3) {
        for (const ing of r.ingredients) {
          const self = isSelfMade(ing.name);
          const ut = self ? effTime(ing.name) : null;
          rows.push({ d: depth + 1, k: `${ing.name} × ${ing.qty} ${self ? '' : '（外购）'}`,
                      v: self ? (ut === Infinity ? '缺来源' : `${ut.toFixed(2)}s → ${(ut * ing.qty).toFixed(1)}s`)
                              : (priceOf(ing.name) ? `${priceOf(ing.name)} 金/件` : '未填价（按0）') });
        }
        for (const ing of r.ingredients) if (recipes[ing.name] && isSelfMade(ing.name)) treeRows(ing.name, depth + 1, rows);
      }
    } else if (g) {
      const y = state.yieldMode === 'min' ? g.ymin : (g.ymin + g.ymax) / 2;
      rows.push({ d: depth, k: `${name} · 采集 ${g.skill}·${g.area} ${g.sec.toFixed(1)}s · 加速 ${accS(g.skill)}% ÷ ${y}`,
                  v: `${(g.sec / (1 + accS(g.skill) / 100) / y).toFixed(2)}s/件`, b: true });
    } else {
      rows.push({ d: depth, k: `${name} · 无时间来源（战斗掉落等）`, v: '缺来源' });
    }
  }

  function showDrawer(html) { $('#fq-drawer').className = 'fq-drawer show'; $('#fq-drawer').innerHTML = html; }

  function openCraftDetail(name) {
    const c = rowCalc(name), r = c.r, rows = [];
    treeRows(name, 0, rows);
    let matBlock = '';
    if (state.matMode === 'buy') {
      matBlock = `<div class="fq-mats">直接材料：勾“自产”则按工时算，不勾按市场价扣成本` +
        r.ingredients.map(i => {
          const self = !!selfMats[i.name];
          return `<div class="fq-matrow">
            <label><input type="checkbox" class="fq-selfbox" data-m="${encodeURIComponent(i.name)}" ${self ? 'checked' : ''}>${i.name} × ${i.qty}</label>
            ${self ? '<span class="tag2">自产（按工时）</span>' : `<input type="number" class="fq-mp" data-m="${encodeURIComponent(i.name)}" step="0.01" value="${priceOf(i.name) || ''}" placeholder="市价 金/件">`}
          </div>`;
        }).join('') +
        `<div style="margin-top:6px">单件材料成本 <b style="color:#f5c451">${fmtMoney(c.mc)}</b> 金 · 自产部分已计入工时</div></div>`;
    }
    showDrawer(`
      <div class="fq-dh"><span class="t">${name}</span>
        <span style="color:#8fa0ae;font-size:11.5px">${PROF[r.profession]} · ${r.category} · 产出 ×${r.qty} · 经验 +${r.xp} · 加速 ${accC(r.category)}%</span>
        <button class="x" id="fq-closeDrawer">关闭</button></div>
      <div class="fq-dbody">
        <div class="fq-tree">${rows.map(x => `<div class="row" style="padding-left:${x.d * 14}px"><span class="k">${x.k}</span><span class="v">${x.v}</span></div>`).join('')}</div>
        <div>
          <div class="fq-kpi">
            <div><div class="k">单件耗时（含前置，已加速）</div><div class="v">${c.u === Infinity ? '∞' : c.u.toFixed(2) + ' s'}</div></div>
            <div><div class="k">本工序基础</div><div class="v">${r.sec.toFixed(1)} s</div></div>
            <div><div class="k">日产量</div><div class="v">${fmt(c.perDay)} 件</div></div>
            <div><div class="k">达标单价</div><div class="v g">${fmtMoney(c.price)}</div></div>
          </div>
          ${matBlock}
        </div>
      </div>`);
    $('#fq-closeDrawer').onclick = () => { $('#fq-drawer').className = 'fq-drawer'; state.open = null; };
    $('#fq-drawer').querySelectorAll('.fq-mp').forEach(inp => inp.onchange = () => {
      priceStore[decodeURIComponent(inp.dataset.m)] = inp.value;
      LS.set('fq_prices', priceStore);
      refreshKeep();
    });
    $('#fq-drawer').querySelectorAll('.fq-selfbox').forEach(bx => bx.onchange = () => {
      const m = decodeURIComponent(bx.dataset.m);
      if (bx.checked) selfMats[m] = 1; else delete selfMats[m];
      LS.set('fq_selfmats', selfMats);
      refreshKeep();
    });
  }

  function openGatherDetail(node, y) {
    const c = gatherCalc(node, y);
    showDrawer(`
      <div class="fq-dh"><span class="t">${y.name}</span>
        <span style="color:#8fa0ae;font-size:11.5px">${node.skill} · ${node.area} · T${String(node.tier).replace('T', '')} · 加速 ${accS(node.skill)}%</span>
        <button class="x" id="fq-closeDrawer">关闭</button></div>
      <div class="fq-dbody">
        <div class="fq-tree">
          <div class="row"><span class="k">采集基础时间</span><span class="v">${node.sec.toFixed(1)} 秒/次</span></div>
          <div class="row"><span class="k">${node.skill} 加速 ${accS(node.skill)}% 后</span><span class="v">${(node.sec / (1 + accS(node.skill) / 100)).toFixed(2)} 秒/次</span></div>
          <div class="row"><span class="k">单次产量</span><span class="v">×${y.min}–${y.max}（按${state.yieldMode === 'min' ? '保底' : '平均'}）</span></div>
          <div class="row"><span class="k">单件耗时</span><span class="v">${c.unit.toFixed(3)} 秒</span></div>
          <div class="row"><span class="k">同区其他产出</span><span class="v">${node.yields.map(q => q.name).join('、')}</span></div>
        </div>
        <div><div class="fq-kpi">
          <div><div class="k">单件耗时</div><div class="v">${c.unit.toFixed(2)} s</div></div>
          <div><div class="k">日产量</div><div class="v">${fmt(c.perDay)} 件</div></div>
          <div><div class="k">达标单价</div><div class="v g">${fmtMoney(c.price)}</div></div>
          <div><div class="k">经验/次</div><div class="v">+${node.xp}</div></div>
        </div></div>
      </div>`);
    $('#fq-closeDrawer').onclick = () => { $('#fq-drawer').className = 'fq-drawer'; state.open = null; };
  }

  /* ---------------- 分类加速面板 ---------------- */
  function buildAccBox() {
    const cats = [...new Set(Object.values(recipes).map(rs => rs[0].category))].sort((a, b) => a.localeCompare(b, 'zh'));
    const row = (key, label, def) => {
      const v = accMap[key];
      return `<div class="fq-accrow"><span>${label}</span>
        <input type="number" step="1" class="fq-accinput" data-k="${key}" value="${typeof v === 'number' ? v : ''}" placeholder="默认">
        <em>默认 ${def}%</em></div>`;
    };
    $('#fq-accbox').innerHTML = `
      <div class="ah"><h3>分类加速设置</h3><button id="fq-accClose">关闭</button></div>
      <div class="hint">留空 = 用上面的「默认加速」。已填的分类单独生效，采集技能的加速也在此设置。</div>
      <h3 style="font-size:11.5px;color:#93a0ad;margin:6px 0 4px">采集技能</h3>
      ${SKILLS.map(s => row('s:' + s, s, state.acc)).join('')}
      <div class="fq-sep"></div>
      <h3 style="font-size:11.5px;color:#93a0ad;margin:6px 0 4px">制作类别</h3>
      ${cats.map(c => row('c:' + c, c, state.acc)).join('')}
      <div class="fq-sep"></div>
      <button class="fq-btn" id="fq-accClear">全部清空，只用默认</button>`;
    $('#fq-accbox').querySelectorAll('.fq-accinput').forEach(inp => inp.onchange = () => {
      const k = inp.dataset.k, v = inp.value.trim();
      if (v === '') delete accMap[k]; else accMap[k] = parseFloat(v) || 0;
      LS.set('fq_accmap', accMap);
      refreshKeep();
    });
    $('#fq-accClear').onclick = () => {
      for (const k in accMap) delete accMap[k];
      LS.set('fq_accmap', accMap);
      render();
    };
    $('#fq-accClose').onclick = () => closeAccBox();
  }

  /* ---------------- 渲染 ---------------- */
  function memoClear() { for (const k in memo) delete memo[k]; }
  function render() {
    buildNav(); buildMid();
    $('#fq-tiers').innerHTML = ['', 1, 2, 3, 4, 5, 6, 7, 8].map(t =>
      `<button data-t="${t}" class="${(state.tier === String(t) || (!state.tier && !t)) ? 'on' : ''}">${t ? 'T' + t : '全部'}</button>`).join('');
    $('#fq-tiers').querySelectorAll('button').forEach(b => b.onclick = () => { state.tier = b.dataset.t; render(); });
    $('#fq-sum').innerHTML = `目标 <b>${fmtMoney(state.target)}</b>/天 · <b>${state.hours}</b>小时 · 默认加速 <b>${state.acc}%</b> · ${state.yieldMode === 'min' ? '保底产量' : '平均产量'} · ${state.matMode === 'buy' ? '材料外购' : '全自产'} · 分类加速 ${Object.keys(accMap).length} 项`;
    renderGrid();
    buildAccBox();
    $('#fq-foot').innerHTML = `数据：${DATA.meta.recipes} 条配方 / ${DATA.meta.nodes} 个采集区域 · 版本 ${DATA.meta.versions.recipes} · 全部本地计算`;
    LS.set('fq_state', state);
  }
  // 刷新但保留当前打开的详情
  function refreshKeep() {
    memoClear();
    render();
    if (state.open && recipes[state.open]) openCraftDetail(state.open);
  }
  function refresh() { memoClear(); state.open = null; $('#fq-drawer').className = 'fq-drawer'; render(); }

  /* ---------------- 事件 ---------------- */
  $('#fq-target').value = fmtMoney(state.target).replace('—', '0');
  $('#fq-hours').value = state.hours;
  $('#fq-acc').value = state.acc;
  $('#fq-target').oninput = e => { const v = parseAmount(e.target.value); if (v > 0) { state.target = v; refreshKeep(); } };
  $('#fq-target').onblur = e => { e.target.value = fmtMoney(state.target).replace('—', '0'); };
  $('#fq-hours').oninput = e => { state.hours = +e.target.value || 0; refreshKeep(); };
  $('#fq-acc').oninput = e => { state.acc = +e.target.value || 0; refreshKeep(); };
  $('#fq-q').oninput = e => { state.q = e.target.value; renderGrid(); };
  $('#fq-accBtn').onclick = () => {
    const box = $('#fq-accbox');
    box.classList.toggle('show');
    $('#fq-accBtn').classList.toggle('on', box.classList.contains('show'));
  };
  function closeAccBox() {
    $('#fq-accbox').classList.remove('show');
    $('#fq-accBtn').classList.remove('on');
  }
  document.addEventListener('mousedown', e => {
    const box = $('#fq-accbox');
    if (!box || !box.classList.contains('show')) return;
    if (box.contains(e.target) || $('#fq-accBtn').contains(e.target)) return;
    closeAccBox();
  });
  $('#fq-yieldSeg').querySelectorAll('button').forEach(b => {
    if (b.dataset.v === state.yieldMode) $('#fq-yieldSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    b.onclick = () => {
      state.yieldMode = b.dataset.v;
      $('#fq-yieldSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      refreshKeep();
    };
  });
  $('#fq-matSeg').querySelectorAll('button').forEach(b => {
    if (b.dataset.v === state.matMode) $('#fq-matSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    b.onclick = () => {
      state.matMode = b.dataset.v;
      $('#fq-matSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      refreshKeep();
    };
  });
  $('#fq-dens').onclick = () => {
    state.dens = state.dens ? 0 : 1;
    $('#fq-dens').textContent = state.dens ? '舒适' : '紧凑';
    $('#fq-grid').style.gridTemplateColumns = state.dens ? 'repeat(auto-fill,minmax(280px,1fr))' : 'repeat(auto-fill,minmax(228px,1fr))';
  };
  $('#fq-grid').addEventListener('click', e => {
    const c = e.target.closest('.fq-card');
    if (!c) return;
    if (c.dataset.craft) { const n = decodeURIComponent(c.dataset.craft); state.open = n; openCraftDetail(n); }
    else if (c.dataset.gather) {
      const k = decodeURIComponent(c.dataset.gather).split('@');
      const node = nodes.find(x => x.skill === state.skill && x.area === k[0]);
      if (!node) return;
      const y = node.yields.find(q => q.name === k[1]);
      state.open = null; openGatherDetail(node, y);
    }
  });

  /* ---------------- 拖动（rAF + transform，避免整块重排） ---------------- */
  function dragEl(el, onEnd, handle) {
    let sx = 0, sy = 0, ox = 0, oy = 0, nx = 0, ny = 0, dx = 0, dy = 0, moved = false, active = false, raf = 0;
    const h = handle || el;
    const apply = () => {
      raf = 0;
      const w = el.offsetWidth || 44, ht = el.offsetHeight || 44;
      const maxX = Math.max(0, window.innerWidth - (w <= window.innerWidth ? w : 340));
      const maxY = Math.max(0, window.innerHeight - (ht <= window.innerHeight ? ht : 140));
      nx = Math.min(maxX, Math.max(0, ox + dx));
      ny = Math.min(maxY, Math.max(0, oy + dy));
      el.style.transform = 'translate3d(' + (nx - ox) + 'px,' + (ny - oy) + 'px,0)';
    };
    h.addEventListener('pointerdown', ev => {
      if (ev.target.tagName === 'BUTTON') return;
      if (el.classList.contains('fq-panel') && el.classList.contains('fq-compact')) return; // 手机全屏不拖
      if (ev.button != null && ev.button !== 0) return;
      moved = false; active = true;
      sx = ev.clientX; sy = ev.clientY;
      ox = el.getBoundingClientRect().left; oy = el.getBoundingClientRect().top;
      nx = ox; ny = oy; dx = dy = 0;
      el.classList.add('fq-dragging');
      try { h.setPointerCapture(ev.pointerId); } catch (e) {}
      const mm = e => {
        if (!active) return;
        dx = e.clientX - sx; dy = e.clientY - sy;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        if (!raf) raf = requestAnimationFrame(apply);
      };
      const mu = () => {
        if (!active) return;
        active = false;
        if (raf) { cancelAnimationFrame(raf); raf = 0; apply(); }
        h.removeEventListener('pointermove', mm);
        h.removeEventListener('pointerup', mu);
        h.removeEventListener('pointercancel', mu);
        el.classList.remove('fq-dragging');
        el.style.transform = '';
        el.style.left = nx + 'px';
        el.style.top = ny + 'px';
        if (onEnd) onEnd(moved);
      };
      h.addEventListener('pointermove', mm);
      h.addEventListener('pointerup', mu);
      h.addEventListener('pointercancel', mu);
    });
  }
  dragEl(launch, moved => { if (moved) LS.set('fq_pos', { x: parseFloat(launch.style.left), y: parseFloat(launch.style.top) }); });
  dragEl(panel, moved => { if (moved) LS.set('fq_box', { x: parseFloat(panel.style.left), y: parseFloat(panel.style.top) }); }, panel.querySelector('.fq-head'));

  const savedBox = LS.get('fq_box', null);

  /* ---------------- 布局模式：窄屏自动切手机版 ---------------- */
  function applyLayout() {
    const compact = window.innerWidth < 600 || panel.offsetWidth < 640;
    panel.classList.toggle('fq-compact', compact);
    if (!compact) {
      const w = Math.min(panel.offsetWidth || 1060, window.innerWidth - 12);
      const h = Math.min(panel.offsetHeight || 680, window.innerHeight - 12);
      panel.style.width = Math.max(700, w) + 'px';
      panel.style.height = Math.max(420, h) + 'px';
    }
    return compact;
  }

  function lockBg(on) {
    document.documentElement.style.overflow = on ? 'hidden' : '';
    document.body.style.overscrollBehavior = on ? 'none' : '';
  }

  launch.addEventListener('click', () => {
    panel.style.display = 'flex';
    const compact = applyLayout();
    lockBg(compact);
    if (compact) { panel.style.left = '0px'; panel.style.top = '0px'; return; }
    const bw = panel.offsetWidth, bh = panel.offsetHeight;
    if (savedBox && savedBox.x != null) {
      panel.style.left = Math.min(window.innerWidth - bw - 8, Math.max(8, savedBox.x)) + 'px';
      panel.style.top = Math.min(window.innerHeight - bh - 8, Math.max(8, savedBox.y)) + 'px';
    } else {
      const x = parseFloat(launch.style.left) || 18, y = parseFloat(launch.style.top) || 140;
      panel.style.left = Math.min(window.innerWidth - bw - 8, Math.max(8, x)) + 'px';
      panel.style.top = Math.min(window.innerHeight - bh - 8, Math.max(8, y)) + 'px';
    }
  });
  $('#fq-min').onclick = () => { panel.style.display = 'none'; lockBg(false); closeAccBox(); };

  /* ---------------- 缩放 ---------------- */
  const size = LS.get('fq_size', null);
  if (size && size.w && size.h) {
    panel.style.width = Math.min(size.w, window.innerWidth - 24) + 'px';
    panel.style.height = Math.min(size.h, window.innerHeight - 24) + 'px';
  }
  const grip = $('#fq-resize');
  function startResize(ev) {
    if (panel.classList.contains('fq-compact')) return;
    ev.preventDefault(); ev.stopPropagation();
    const sw = panel.offsetWidth, sh = panel.offsetHeight;
    const sx = ev.clientX, sy = ev.clientY;
    const mm = e => {
      const w = Math.max(640, Math.min(window.innerWidth - 12, sw + (e.clientX - sx)));
      const h = Math.max(420, Math.min(window.innerHeight - 12, sh + (e.clientY - sy)));
      panel.style.width = w + 'px';
      panel.style.height = h + 'px';
      panel.classList.toggle('fq-compact', window.innerWidth < 600 || w < 640);
    };
    const mu = () => {
      document.removeEventListener('pointermove', mm);
      document.removeEventListener('pointerup', mu);
      if (!panel.classList.contains('fq-compact')) LS.set('fq_size', { w: panel.offsetWidth, h: panel.offsetHeight });
    };
    document.addEventListener('pointermove', mm);
    document.addEventListener('pointerup', mu);
  }
  grip.addEventListener('pointerdown', startResize);
  window.addEventListener('resize', () => {
    if (panel.style.display === 'none') return;
    const compact = applyLayout();
    lockBg(compact);
    if (compact) { panel.style.left = '0px'; panel.style.top = '0px'; return; }
    const w = Math.min(panel.offsetWidth, window.innerWidth - 12);
    const h = Math.min(panel.offsetHeight, window.innerHeight - 12);
    panel.style.width = w + 'px';
    panel.style.height = h + 'px';
  });

  render();
})();
</script></body></html>
